name: Build Neko LPK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-neko-lpk-v-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate package and tag version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2; exit}' package.yml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'A SemVer package version is required' >&2
            exit 1
          fi
          if [[ "${REF_TYPE}" == tag && "${REF_NAME}" != "v${version}" ]]; then
            echo 'The tag must match the package version' >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and verify LPK
        id: build
        uses: ca-x/lazycat-github-action@v1.3.6
        env:
          LAZYCAT_WORKFLOW_TOOLCHAINS: node,rust
          LAZYCAT_WORKFLOW_NODE_VERSION: 24
          LAZYCAT_WORKFLOW_RUST_TOOLCHAIN: 1.97.1
        with:
          operation: build
          config: .github/lazycat-action.yml
          version: ${{ steps.version.outputs.version }}
      - name: Upload LPK only
        uses: actions/upload-artifact@v7
        with:
          name: neko-lpk-v${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.lpk-path }}
          if-no-files-found: error
          retention-days: 3
