version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/neko-webshell.lpk

update:
  sync_homepage: false
  sync_license: false
  strategy: publish
  version_source:
    type: git

build:
  toolchains:
    - kind: node
      version: 24.x
    - kind: rust
      version: 1.97.1
  run_buildscript: true

release:
  use_github_release_notes: false
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
