[package]
name = "neko-remoted-transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
neko-remoted-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
webrtc = { version = "=0.17.3", default-features = false }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
