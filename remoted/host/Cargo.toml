[package]
name = "neoko-terminal-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
allocator-api2 = "0.4"
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf", default-features = false, features = ["allocator_api"] }
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
hostname = "0.3.1"
neko-hc-client = { path = "../../crates/hc-client" }
neko-remoted-protocol = { path = "../protocol" }
neko-remoted-transport = { path = "../transport" }
neko-program-status = { path = "../../crates/program-status" }
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
x25519-dalek = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes"] }
